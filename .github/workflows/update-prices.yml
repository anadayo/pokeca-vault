name: Update card prices

on:
  schedule:
    ## 10:00, 15:00, 18:00, 21:00 JST every day
    - cron: '0 1,6,9,12 * * *'
  workflow_dispatch:
    
permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update prices from Hareruya2
        run: node scripts/update-prices.js

      - name: Build One Piece card vault
        run: node scripts/build-onepiece-vault.js

      - name: Update One Piece card prices
        run: node scripts/update-onepiece-prices.js

      - name: Build SEO card pages
        run: node scripts/build-seo-pages.js

      - name: Test SEO pages and app scripts
        run: node scripts/test-seo-pages.js

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update card prices'
          file_pattern: index.html pokeca-vault.html cards/** sitemap.xml robots.txt onepiece-card-vault/index.html onepiece-card-vault/cards.json onepiece-card-vault/cards/** onepiece-card-vault/sitemap.xml onepiece-card-vault/robots.txt onepiece-price-update-report.json onepiece-catalog-report.json
